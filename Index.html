<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f6f9;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input[type="text"], input[type="email"], input[type="password"], input[type="date"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    input[type="checkbox"] {
      margin-top: 10px;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      border: none;
      background: #28a745;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>
<body>

  <form id="registrationForm">
    <label>Name</label>
    <input type="text" id="name" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Password</label>
    <input type="password" id="password" required>

    <label>Date of Birth</label>
    <input type="date" id="dob" required>

    <label>
      <input type="checkbox" id="terms"> Accept terms and conditions
    </label>

    <button type="submit">Submit</button>
  </form>

  <h2>Entries</h2>
  <table id="entriesTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Password</th>
        <th>DOB</th>
        <th>Terms</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", function(event){
      event.preventDefault();

      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value.trim();
      let dob = document.getElementById("dob").value;
      let terms = document.getElementById("terms").checked ? "Yes" : "No";

      if(!name || !email || !password || !dob || terms === "No"){
        alert("Please fill all fields and accept terms!");
        return;
      }

      // Age validation
      let birthDate = new Date(dob);
      let today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      let monthDiff = today.getMonth() - birthDate.getMonth();
      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }

      if(age < 18 || age > 60){
        alert("Age must be between 18 and 60 years.");
        return;
      }

      // Insert data into table
      let table = document.getElementById("entriesTable").getElementsByTagName("tbody")[0];
      let newRow = table.insertRow();

      newRow.insertCell(0).textContent = name;
      newRow.insertCell(1).textContent = email;
      newRow.insertCell(2).textContent = password;
      newRow.insertCell(3).textContent = dob;
      newRow.insertCell(4).textContent = terms;

      // Reset form
      document.getElementById("registrationForm").reset();
    });
  </script>

</body>
</html>
